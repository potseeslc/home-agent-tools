name: Application checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: node --check home_agent_tools/static/app.js
      - run: git diff --check
